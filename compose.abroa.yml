# Abroa P5 backend-only deployment template.
# Self-hosted is the default; managed cloud is the explicit override file.
# Copy .env.abroa.example into a protected .env outside the repository,
# configure ALL required secrets, and retain them across upgrades/restores.
# No P7 UI or P8 production deployment is performed by this Compose file.
name: ${COMPOSE_PROJECT_NAME:-abroa-p5}

x-database-credentials: &database_credentials
  POSTGRES_USER: ${ABROA_DB_USER:?Set ABROA_DB_USER}
  POSTGRES_PASSWORD: ${ABROA_DB_PASSWORD:?Set a unique database password}
  POSTGRES_DB: ${ABROA_DB_NAME:-abroa}

x-application-environment: &application_environment
  <<: *database_credentials
  RAILS_ENV: production
  RAILS_LOG_TO_STDOUT: "true"
  RAILS_SERVE_STATIC_FILES: "true"
  RAILS_FORCE_SSL: ${ABROA_FORCE_SSL:-false}
  RAILS_ASSUME_SSL: ${ABROA_ASSUME_SSL:-false}
  SELF_HOSTED: "true"
  DB_HOST: db
  DB_PORT: "5432"
  SECRET_KEY_BASE: ${ABROA_SECRET_KEY_BASE:?Set unique 64+ byte secret, preserve when upgrading}
  ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY:-}
  ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT:-}
  REDIS_URL: redis://:${ABROA_REDIS_PASSWORD:?Set a Redis password}@redis:6379/1
  AUTO_SYNC_ENABLED: ${ABROA_AUTO_SYNC_ENABLED:-true}
  OPENAI_ACCESS_TOKEN: ""
  STRIPE_SECRET_KEY: ""
  STRIPE_WEBHOOK_SECRET: ""
  PLAID_CLIENT_ID: ""
  PLAID_SECRET: ""
  AI_HEALTH_PROBE_TIMEOUT: "2"

x-app-security: &app_security
  security_opt:
    - no-new-privileges:true
  init: true

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      <<: *database_credentials
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [private]
    stop_grace_period: 45s

  redis:
    image: redis:7
    command: [ "redis-server", "--appendonly", "yes", "--requirepass", "${ABROA_REDIS_PASSWORD:?Set a Redis password}" ]
    restart: unless-stopped
    environment:
      ABROA_REDIS_PASSWORD: ${ABROA_REDIS_PASSWORD:?Set a Redis password}
    volumes:
      - redis-data:/data
    healthcheck:
      test: [ "CMD-SHELL", "REDISCLI_AUTH=$$ABROA_REDIS_PASSWORD redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 3s
      retries: 15
      start_period: 10s
    networks: [private]
    stop_grace_period: 30s

  web:
    <<: *app_security
    image: ${ABROA_IMAGE:-abroa:p5}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: [ "./bin/rails", "server" ]
    ports:
      # Loopback-only by default. Put TLS termination in a configured reverse proxy.
      - "127.0.0.1:${ABROA_HTTP_PORT:-3300}:3000"
    environment:
      <<: *application_environment
    volumes:
      - app-storage:/rails/storage
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent --max-time 3 http://127.0.0.1:3000/up >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    networks: [private]
    stop_grace_period: 45s

  worker:
    <<: *app_security
    image: ${ABROA_IMAGE:-abroa:p5}
    restart: unless-stopped
    command: [ "bundle", "exec", "sidekiq" ]
    environment:
      <<: *application_environment
    volumes:
      - app-storage:/rails/storage
    depends_on:
      web: { condition: service_healthy }
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: [ "CMD-SHELL", "ps -ef | grep -E '[s]idekiq' >/dev/null" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [private]
    stop_grace_period: 120s

  backup:
    profiles: [backup]
    image: postgres:17
    environment:
      <<: *database_credentials
      PGHOST: db
      PGPORT: "5432"
      PGUSER: ${ABROA_DB_USER:?Set ABROA_DB_USER}
      PGPASSWORD: ${ABROA_DB_PASSWORD:?Set DB password}
      PGDATABASE: ${ABROA_DB_NAME:-abroa}
    volumes:
      - ./backups:/backups
    networks: [private]
    depends_on:
      db: { condition: service_healthy }
    entrypoint: [ "sh", "-ec" ]
    command:
      - 'umask 077; pg_dump --format=custom --no-owner --no-acl -f "/backups/abroa-$$(date -u +%Y%m%dT%H%M%SZ).dump"'

networks:
  private:
    driver: bridge

volumes:
  database-data:
  redis-data:
  app-storage:
